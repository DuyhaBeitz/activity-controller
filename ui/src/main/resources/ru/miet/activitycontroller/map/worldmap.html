<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>WorldMap</title>

        <!-- Ресурсы -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
        </script>

        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
        <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

        <style>
            /* Стиль для карты */
            html, body, #map
            {

                padding: 0;
                margin: 0;
                height: 100%;
                width: 100%;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 14px;
                color: #323232;
            }

            /* Стиль для маркера */
            .custom-status-marker
            {
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                color: white;
                font-weight: bold;
                font-size: 1.2vmin;
                box-shadow: 0 0 0.6vmin rgba(0,0,0,0.4);
                transition: transform 0.1s ease;
            }
            .custom-status-marker:hover
            {
                transform: scale(1.15);
            }

            /* Стиль для подсказки */
            .responsive-tooltip {
            font-size: 1.8vmin !important;
            padding: 0.4vmin 0.8vmin !important;
            border-radius: 0.4vmin !important;
            background-color: white !important;
            color: black !important;
            border: none !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            }

            /* Стиль для кластера */
            .marker-cluster
            {
                background-clip: padding-box;
                border-radius: 50%;
            }
            .marker-cluster div
            {
                width: 3.5vmin;
                height: 3.5vmin;
                margin-left: 0.5vmin;
                margin-top: 0.5vmin;

                text-align: center;
                border-radius: 50%;
                font: bold 1.3vmin "Helvetica Neue", Arial, Helvetica, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
            }   
        </style>
    </head>

    <body>
        <div id="map"></div>

        <script>
            // Отключение анимаций для производительности
            L.Browser.any3d = false;
            L.Browser.webkit3d = false;
            L.Browser.gecko3d = false;
            L.Browser.opera3d = false;
            L.Browser.ms3d = false;

            // Размеры карты
            var southWest = L.latLng(-80, -190);
            var northEast = L.latLng(85, 190);
            var worldBounds = L.latLngBounds(southWest, northEast);

            // Инициализация карты
            var map = L.map('map',{
                fadeAnimation: false,
                zoomAnimation: false,
                markerZoomAnimation: false,
                inertial: false,
                attributionControl: false,
                minZoom: 2,
                maxZoom: 18,
                maxBounds: worldBounds,
                maxBoundsViscosity: 1.0
            }).setView([20,0], 2);

            // Слои карты
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                bounds: worldBounds
            }).addTo(map);

            // Инициализация кластеров
            var markerClusterGroup = L.markerClusterGroup({
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                disableClusteringAtZoom: 16,
                
                // Определяем создание иконки для меняющегося цвета и размера
                iconCreateFunction: function(cluster)
                {
                    var childMarkers = cluster.getAllChildMarkers();
                    var worstStatus = 'OK';
                    var priority = { 'OK': 1, 'WARNING': 2, 'CONTROL': 3, 'ERROR': 4 };
                    
                    childMarkers.forEach(function(marker)
                    {
                        var status = marker.options.serviceStatus;
                        if (priority[status] > priority[worstStatus]) {
                            worstStatus = status;
                        }
                    });
                    
                    var color = '#95a5a6'; // Серый по умолчанию
                    var symbol = '';
                    
                    if (worstStatus === 'OK'){ color = '#2ecc71'; symbol = '✓'; }
                    else if (worstStatus === 'WARNING') { color = '#f1c40f'; symbol = '?'; }
                    else if (worstStatus === 'ERROR') { color = '#e74c3c'; symbol = '✖'; }
                    else if (worstStatus === 'CONTROL') { color = '#e74c3c'; symbol = '!'; }
                    
                    var count = cluster.getChildCount();
                    var clusterSize = getResponsiveSize(3.6);
                    
                    var htmlContent = '<div style="background-color:'+ color + 
                    '; width:100%; height:100%; border-radius:50%;' + 
                    'display:flex; align-items:center; justify-content:center;' +
                    'color:white; font-weight:bold;' +
                    'border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.4);">' 
                    + '<span style="margin-right: 2px; font-size: 85%;">' + symbol
                    + '</span>' + count + '</div>';
                        
                    return new L.DivIcon({
                        className: 'custom-cluster-marker',
                        html: htmlContent,
                        iconSize: [clusterSize, clusterSize]
                    });
                }
            });

            // Добавляем кластеры в слои
            map.addLayer(markerClusterGroup);

            // Массив маркеров
            var markersMap = [];

            // Метод для задания адаптивного размера обьекта
            function getResponsiveSize(targetVmin)
            {
                var vmin = Math.min(window.innerWidth, window.innerHeight);
                return Math.max(18, Math.round((targetVmin / 100) * vmin));
            }

            // Метод для создания html иконки
            function createIconHtml(color, symbol, size)
            {
                var borderWidth = 'calc(' + (size * 0.1) + 'px)';
                var shadowSize = 'calc(' + (size * 0.3) + 'px)';
                
                return '<div style="' +
                    'background-color:' + color + '; ' +
                    'width:100%; height:100%; ' +
                    'border-radius:50%; ' +
                    'display:flex; align-items:center; justify-content:center; ' +
                    'color:white; ' +
                    'font-family: Arial, sans-serif; ' +
                    'font-weight:bold; ' +
                    'font-size: calc(' + (size * 0.55) + 'px); ' +
                    'border: ' + borderWidth + ' solid white; ' +
                    'box-shadow: 0 0 ' + shadowSize + ' rgba(0,0,0,0.4);' +
                    '">' + symbol + '</div>';
            }

            // Метод для добавления сервиса
            function addServiceMarker(id, x, y, name, status)
            {
                var color = '#95a5a6'; // серый по умолчанию
                var symbol = '';
                if (status === 'OK') { color = '#2ecc71'; symbol = '✓'; }
                else if (status === 'WARNING') { color = '#f1c40f'; symbol = '?'; }
                else if (status === 'ERROR') { color = '#e74c3c'; symbol = '✖'; }
                else if (status === 'CONTROL') { color = '#e74c3c'; symbol = '!'; }

                var size = getResponsiveSize(2.4);
                var customIcon = L.divIcon({
                    className: 'custom-status-marker',
                    html: createIconHtml(color, symbol, size),
                    iconSize: [size, size],
                    iconAnchor: [size / 2, size / 2]
                });

                var marker = L.marker([x, y], {
                    icon: customIcon,
                    serviceStatus: status
                });

                // Вывод имени при наведении
                marker.bindTooltip(name, { 
                    direction: 'top',
                    className: 'responsive-tooltip'
                });

                marker.on('click', function() {
                    if (window.javaApp && typeof window.javaApp.openDiagnostic === 'function') {
                        window.javaApp.openDiagnostic(id);
                        // диагностика при клике (в разработке)
                    }
                });

                // Добавляем маркер в массив и кластеры
                markersMap[id] = marker;
                markerClusterGroup.addLayer(marker);
            }

            // Метод для обновления маркера
            function updateServiceStatus(id, status)
            {
                if (typeof markersMap !== 'undefined' && markersMap[id])
                {
                    var marker = markersMap[id];
                    
                    marker.options.serviceStatus = status;

                    var color = '#95a5a6';
                    var symbol = '';
                    if (status === 'OK') { color = '#2ecc71'; symbol = '✓'; }
                    else if (status === 'WARNING') { color = '#f1c40f'; symbol = '?'; }
                    else if (status === 'ERROR') { color = '#e74c3c'; }
                    else if (status === 'CONTROL') { color = '#e74c3c'; symbol = '!'; }

                    var size = getResponsiveSize(2.4);
                    var newIcon = L.divIcon({
                        className: 'custom-status-marker',
                        html: createIconHtml(color, symbol, size),
                        iconSize: [size, size],
                        iconAnchor: [size / 2, size / 2]
                    });

                    marker.setIcon(newIcon);

                    markerClusterGroup.refreshClusters(marker);
                }
            }

            setTimeout(function() { 
                map.invalidateSize(); 
            }, 200);
        </script>
    </body>
</html>
