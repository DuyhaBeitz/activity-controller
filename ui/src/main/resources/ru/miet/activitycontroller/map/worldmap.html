<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>WorldMap</title>

        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
        </script>

        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
        <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

        <style>
            html, body, #map
            {
                padding: 0;
                margin: 0;
                height: 100%;
                width: 100%;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 14px;
                color: #323232;
            }

            .custom-status-marker
            {
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                color: white;
                font-weight: bold;
                font-size: 13px;
                border: 2px solid white;
                box-shadow: 0 0 6px rgba(0,0,0,0.4);
                transition: transform 0.1s ease;
            }
            .custom-status-marker:hover
            {
                transform: scale(1.15);
            }

            
            html, body, #map
            {
                padding: 0;
                margin: 0;
                height: 100%;
                width: 100%;
                background-color: #f0f0f0;
            }
        </style>
    </head>

    <body>
        <div id="map"></div>

        <script>
            L.Browser.any3d = false;
            L.Browser.webkit3d = false;
            L.Browser.gecko3d = false;
            L.Browser.opera3d = false;
            L.Browser.ms3d = false;

            var southWest = L.latLng(-80, -190);
            var northEast = L.latLng(85, 190);
            var worldBounds = L.latLngBounds(southWest, northEast);

            var map = L.map('map',{
                fadeAnimation: false,
                zoomAnimation: false,
                markerZoomAnimation: false,
                inertial: false,
                attributionControl: false,
                minZoom: 2,
                maxZoom: 18,
                maxBounds: worldBounds,
                maxBoundsViscosity: 1.0
            }).setView([20,0],2);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                bounds: worldBounds,
                //noWrap: true,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            var markerClusterGroup = L.markerClusterGroup({
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                disableClusteringAtZoom: 16,
                
                iconCreateFunction: function(cluster) {
                    var childMarkers = cluster.getAllChildMarkers();
                    var worstStatus = 'OK';
                    
                    var priority = { 'OK': 1, 'WARNING': 2, 'CONTROL': 3, 'ERROR': 4 };
                    
                    childMarkers.forEach(function(marker)
                    {
                        var status = marker.options.serviceStatus;
                        if (priority[status] > priority[worstStatus])
                        {
                            worstStatus = status;
                        }
                    });
                    
                    var color = '#95a5a6'; // Серый по умолчанию
                    var symbol = '';
                    
                    if (worstStatus === 'OK') { color = '#2ecc71'; symbol = '✓'; }
                    else if (worstStatus === 'WARNING') { color = '#f1c40f'; symbol = '?'; }
                    else if (worstStatus === 'ERROR') { color = '#e74c3c'; }
                    else if (worstStatus === 'CONTROL') { color = '#e74c3c'; symbol = '!'; }
                    
                    var count = cluster.getChildCount();
                    
                    return new L.DivIcon({
                        className: 'custom-cluster-marker',
                        html: '<div style="background-color:' + color + '; width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.4);">' 
                            + count + '</div>',
                        iconSize: [40, 40]
                    });
                }
            });

            map.addLayer(markerClusterGroup);
            var markersMap = [];

            function addServiceMarker(id, x, y, name, status)
            {
                // status: OK, WARNING, ERROR, CONTROL
                var color = '#95a5a6'; // Серый по умолчанию
                var symbol = '';
                if (status === 'OK') 
                {
                    color = '#2ecc71'; // Зеленый
                    symbol = '✓'
                }
                else if (status === 'WARNING') 
                {
                    color = '#f1c40f'; // Желтый
                    symbol = '?'
                }
                else if (status === 'ERROR')
                {
                    color = '#e74c3c'; // Красный
                }
                else if (status === 'CONTROL')
                {
                    color = '#e74c3c'; // Красный
                    symbol = '!'
                }
        
                var customIcon = L.divIcon({
                    className: 'custom-status-marker',
                    html: '<div style="background-color:' + color + ';width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;border:2px solid white;box-shadow:0 0 6px rgba(0,0,0,0.4);">' + symbol + '</div>',
                    iconSize: [22,22],
                    iconAnchor: [11,11]
                });

                var marker = L.marker([x, y], {
                    icon: customIcon,
                    serviceStatus: status
                });

                marker.bindTooltip(name);

                marker.on('click', function() {
                    if (window.javaApp && typeof window.javaApp.openDiagnostic === 'function')
                    {
                        window.javaApp.openDiagnostic(id);
                    }
                });

                markersMap[id] = marker;
                markerClusterGroup.addLayer(marker);
            }

            setTimeout(function() { 
                map.invalidateSize(); 
            }, 200);
        </script>
    </body>
</html>
